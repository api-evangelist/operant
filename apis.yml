aid: operant
name: Operant
description: >-
  Operant AI is a San Francisco-based runtime security company (founded 2021,
  backed by Felicis) that protects cloud and AI applications with real-time,
  Kubernetes-native "3D Runtime Defense" — discovery, detection, and defense
  across APIs, services, LLMs, and agents. Its platform delivers automatic API
  discovery and catalogs, API-to-API microsegmentation, protocol-specific
  authentication/authorization, traffic rate limiting, inline auto-redaction of
  sensitive/PII data, and OWASP/MITRE guardrails that block a majority of the
  OWASP Top 10 threats. Product lines include Agent Protector, Endpoint
  Protector, AI Gatekeeper, an MCP Gateway, and Cloud Application Detection and
  Response (CADR). Operant is SOC 2 Type II compliant and publishes open-source
  tooling such as Woodpecker (red teaming for AI and cloud).
